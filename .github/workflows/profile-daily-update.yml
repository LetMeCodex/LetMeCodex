name: Daily Matrix & Easter Egg Protocol

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-daily-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Daily Matrix SVG
        run: node scripts/generate-daily-matrix.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add assets/daily-easter-egg.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): daily 7-day easter egg shift [skip ci]" && git push)

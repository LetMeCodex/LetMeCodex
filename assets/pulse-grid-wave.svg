    </g>

    <!-- Interactive Grid Cells Group -->
    <g id="pulse-cells">
      <!-- 0-10 Columns -->
      <g class="col-wave-1">
        <rect x="10" y="30" width="8" height="8" rx="1.5" fill="#0E4429"/>
        <rect x="20" y="30" width="8" height="8" rx="1.5" fill="#006D32"/>
        <rect x="30" y="20" width="8" height="8" rx="1.5" fill="#26A641"/>

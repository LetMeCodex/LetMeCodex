        <rect x="120" y="30" width="8" height="8" rx="1.5" fill="#006D32"/>
        <rect x="130" y="20" width="8" height="8" rx="1.5" fill="#26A641"/>
        <rect x="140" y="10" width="8" height="8" rx="1.5" fill="#39D353"/>

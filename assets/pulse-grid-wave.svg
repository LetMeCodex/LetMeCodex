<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <style>
      @keyframes waveCrest {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
      @keyframes sweepScan {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(850px); }
      }
      @keyframes octoPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .inter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      
      .col-wave-1 { animation: waveCrest 3.2s infinite ease-in-out; animation-delay: 0.1s; }
      .col-wave-2 { animation: waveCrest 3.2s infinite ease-in-out; animation-delay: 0.4s; }
      .col-wave-3 { animation: waveCrest 3.2s infinite ease-in-out; animation-delay: 0.7s; }
      .col-wave-4 { animation: waveCrest 3.2s infinite ease-in-out; animation-delay: 1.0s; }
      .col-wave-5 { animation: waveCrest 3.2s infinite ease-in-out; animation-delay: 1.3s; }
      .col-wave-6 { animation: waveCrest 3.2s infinite ease-in-out; animation-delay: 1.6s; }
      .col-wave-7 { animation: waveCrest 3.2s infinite ease-in-out; animation-delay: 1.9s; }
      .col-wave-8 { animation: waveCrest 3.2s infinite ease-in-out; animation-delay: 2.2s; }
      .col-wave-9 { animation: waveCrest 3.2s infinite ease-in-out; animation-delay: 2.5s; }
      .col-wave-10 { animation: waveCrest 3.2s infinite ease-in-out; animation-delay: 2.8s; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="200" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Subheader Bar -->
  <rect x="0" y="0" width="850" height="34" rx="8" fill="#161B22"/>
  <rect x="0" y="26" width="850" height="8" fill="#161B22"/>
  <line x1="0" y1="34" x2="850" y2="34" stroke="#30363D" stroke-width="1"/>

  <g transform="translate(16, 21)">
    <!-- Activity Icon -->
    <circle cx="6" cy="0" r="5.5" fill="none" stroke="#3FB950" stroke-width="1.2"/>
    <circle cx="6" cy="0" r="2" fill="#3FB950"/>
    <text x="18" y="4" class="mono" fill="#E6EDF3" font-size="11" font-weight="600">Contribution Grid Pulse Wave</text>
    <text x="212" y="4" class="mono" fill="#30363D">•</text>
    <text x="224" y="4" class="mono" fill="#3FB950" font-size="11" font-weight="700" letter-spacing="1">░▒▓██▓▒░</text>
  </g>

  <!-- Display Mode Badges -->
  <g transform="translate(420, 9)">
    <rect x="0" y="0" width="48" height="18" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="8" y="12" class="mono" fill="#3FB950" font-size="10" font-weight="700">Wave</text>

    <rect x="54" y="0" width="80" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <text x="60" y="12" class="mono" fill="#7D8590" font-size="10">@LetMeCodex</text>

    <rect x="140" y="0" width="60" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <text x="148" y="12" class="mono" fill="#7D8590" font-size="10">Octocat</text>

    <rect x="206" y="0" width="68" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <text x="212" y="12" class="mono" fill="#7D8590" font-size="10">Runner 👾</text>
  </g>

  <g transform="translate(710, 21)" class="mono" font-size="10" fill="#7D8590">
    <text x="0" y="0">60.0 FPS</text>
    <text x="50" y="0" fill="#30363D">•</text>
    <text x="62" y="0">Amp: 1.00</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- 64-COLUMN x 9-ROW GITHUB CONTRIBUTION MATRIX CELL STAGE         -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(18, 48)">
    <!-- Base Background Grid of Empty Cells (#161B22 border #21262D) -->
    <!-- Let's render procedural columns with GitHub activity gradients -->
    
    <!-- Zone 1: Ambient baseline -->
    <g fill="#161B22" stroke="#21262D" stroke-width="1">

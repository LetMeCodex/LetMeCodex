<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020905"/>
      <stop offset="50%" stop-color="#05160c"/>
      <stop offset="100%" stop-color="#010503"/>
    </linearGradient>

    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0"/>
      <stop offset="70%" stop-color="#00ff66" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0, 255, 102, 0.04)" stroke-width="1.5"/>
    </pattern>

    <style>
      @keyframes fall1 { 0% { transform: translateY(-320px); opacity: 0; } 50% { opacity: 0.9; } 100% { transform: translateY(320px); opacity: 0; } }
      @keyframes fall2 { 0% { transform: translateY(-280px); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(340px); opacity: 0; } }
      @keyframes fall3 { 0% { transform: translateY(-350px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(320px); opacity: 0; } }
      @keyframes scan { 0% { transform: translateY(-10px); } 100% { transform: translateY(330px); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 10px #00ff66); } 50% { opacity: 1; filter: drop-shadow(0 0 22px #00ffaa); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes glitch { 0%, 94%, 100% { transform: translate(0, 0); } 95% { transform: translate(-2px, 1px); } 97% { transform: translate(2px, -1px); } 99% { transform: translate(-1px, -1px); } }

      .stream1 { animation: fall1 4.5s infinite linear; font-family: monospace; font-size: 13px; fill: #00ff66; }
      .stream2 { animation: fall2 6s infinite linear 1.2s; font-family: monospace; font-size: 12px; fill: #00e65c; }
      .stream3 { animation: fall3 3.8s infinite linear 2.1s; font-family: monospace; font-size: 14px; fill: #55ff99; }
      .scanbar { animation: scan 3.5s infinite linear; }
      .title-glow { animation: pulseGlow 3s infinite ease-in-out, glitch 7s infinite ease; }
      .cursor-blink { animation: blink 0.9s infinite; }
      .hud-text { font-family: 'Consolas', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background Screen -->
  <rect width="850" height="320" rx="16" fill="url(#bgGlow)" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Matrix Digital Streams -->
  <g opacity="0.45">
    <!-- Stream Column 1 -->
    <text x="35" y="0" class="stream1">0<tspan x="35" dy="18">1</tspan><tspan x="35" dy="18">0</tspan><tspan x="35" dy="18">λ</tspan><tspan x="35" dy="18">1</tspan><tspan x="35" dy="18">0</tspan><tspan x="35" dy="18">Ψ</tspan><tspan x="35" dy="18">1</tspan><tspan x="35" dy="18">0</tspan><tspan x="35" dy="18">1</tspan></text>
    <!-- Stream Column 2 -->
    <text x="95" y="0" class="stream3">Ξ<tspan x="95" dy="18">0</tspan><tspan x="95" dy="18">1</tspan><tspan x="95" dy="18">1</tspan><tspan x="95" dy="18">0</tspan><tspan x="95" dy="18">Ω</tspan><tspan x="95" dy="18">0</tspan><tspan x="95" dy="18">1</tspan><tspan x="95" dy="18">1</tspan></text>
    <!-- Stream Column 3 -->
    <text x="160" y="0" class="stream2">1<tspan x="160" dy="18">0</tspan><tspan x="160" dy="18">1</tspan><tspan x="160" dy="18">0</tspan><tspan x="160" dy="18">∑</tspan><tspan x="160" dy="18">0</tspan><tspan x="160" dy="18">1</tspan><tspan x="160" dy="18">1</tspan><tspan x="160" dy="18">0</tspan></text>
    <!-- Stream Column 4 -->
    <text x="230" y="0" class="stream1">1<tspan x="230" dy="18">1</tspan><tspan x="230" dy="18">0</tspan><tspan x="230" dy="18">π</tspan><tspan x="230" dy="18">1</tspan><tspan x="230" dy="18">0</tspan><tspan x="230" dy="18">1</tspan><tspan x="230" dy="18">0</tspan></text>
    <!-- Stream Column 5 -->
    <text x="630" y="0" class="stream2">0<tspan x="630" dy="18">1</tspan><tspan x="630" dy="18">0</tspan><tspan x="630" dy="18">λ</tspan><tspan x="630" dy="18">1</tspan><tspan x="630" dy="18">1</tspan><tspan x="630" dy="18">0</tspan><tspan x="630" dy="18">Ψ</tspan></text>
    <!-- Stream Column 6 -->
    <text x="710" y="0" class="stream3">1<tspan x="710" dy="18">0</tspan><tspan x="710" dy="18">1</tspan><tspan x="710" dy="18">Ω</tspan><tspan x="710" dy="18">0</tspan><tspan x="710" dy="18">1</tspan><tspan x="710" dy="18">1</tspan><tspan x="710" dy="18">0</tspan></text>
    <!-- Stream Column 7 -->
    <text x="790" y="0" class="stream1">0<tspan x="790" dy="18">1</tspan><tspan x="790" dy="18">1</tspan><tspan x="790" dy="18">0</tspan><tspan x="790" dy="18">∑</tspan><tspan x="790" dy="18">1</tspan><tspan x="790" dy="18">0</tspan><tspan x="790" dy="18">1</tspan></text>
  </g>

  <!-- CRT Scanlines Overlay -->
  <rect width="850" height="320" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Scanning Sweep Beam -->
  <rect class="scanbar" x="0" y="0" width="850" height="12" fill="url(#rainGrad)" opacity="0.18"/>

  <!-- Center HUD Frame -->
  <rect x="180" y="45" width="490" height="230" rx="12" fill="#041209" fill-opacity="0.82" stroke="#00ff66" stroke-width="1.2" stroke-dasharray="8 4"/>

  <!-- HUD Corner Markers -->
  <path d="M 175 60 L 175 45 L 190 45" stroke="#00ff66" stroke-width="2.5" fill="none"/>
  <path d="M 675 60 L 675 45 L 660 45" stroke="#00ff66" stroke-width="2.5" fill="none"/>
  <path d="M 175 260 L 175 275 L 190 275" stroke="#00ff66" stroke-width="2.5" fill="none"/>
  <path d="M 675 260 L 675 275 L 660 275" stroke="#00ff66" stroke-width="2.5" fill="none"/>

  <!-- Header Content -->
  <text x="425" y="82" text-anchor="middle" class="hud-text title-glow" fill="#00ff66" font-size="11" letter-spacing="4" font-weight="bold">
    ◈ MATRIX PROTOCOL INITIATED ◈
  </text>

  <text x="425" y="132" text-anchor="middle" class="hud-text title-glow" fill="#ffffff" font-size="30" font-weight="900" letter-spacing="3">
    LETMICODEX // ARCHITECT
  </text>

  <text x="425" y="165" text-anchor="middle" class="hud-text" fill="#7bf3a5" font-size="13" letter-spacing="1.5">
    Fullstack Creative Engineer · 3D WebGL · Physics Rigs
  </text>

  <!-- Animated Terminal Command -->
  <g transform="translate(230, 195)">
    <rect width="390" height="42" rx="8" fill="#010803" stroke="#00ff66" stroke-opacity="0.4" stroke-width="1"/>
    <text x="16" y="26" class="hud-text" fill="#00ff66" font-size="13">
      $ ./enter_matrix.sh --mode=god-tier<tspan class="cursor-blink" fill="#ffffff"> █</tspan>
    </text>
  </g>

  <!-- Live Status Badges -->
  <g transform="translate(245, 258)">
    <circle cx="0" cy="0" r="4" fill="#00ff66" filter="url(#matrixGlow)"/>
    <text x="12" y="4" class="hud-text" fill="#a7f3d0" font-size="11">SYSTEM: ONLINE</text>

    <circle cx="160" cy="0" r="4" fill="#38bdf8"/>
    <text x="172" y="4" class="hud-text" fill="#bae6fd" font-size="11">SIMULATION: 60 FPS</text>

    <circle cx="310" cy="0" r="4" fill="#facc15"/>
    <text x="322" y="4" class="hud-text" fill="#fde047" font-size="11">EASTER EGG: ACTIVE</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="100%">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="85%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <style>
      @keyframes eqJump1 { 0%, 100% { height: 12px; y: 108px; } 50% { height: 75px; y: 45px; } }
      @keyframes eqJump2 { 0%, 100% { height: 18px; y: 102px; } 50% { height: 85px; y: 35px; } }
      @keyframes eqJump3 { 0%, 100% { height: 8px; y: 112px; } 50% { height: 95px; y: 25px; } }
      @keyframes eqJump4 { 0%, 100% { height: 25px; y: 95px; } 50% { height: 60px; y: 60px; } }

      .b1 { animation: eqJump1 0.8s infinite ease-in-out alternate; }
      .b2 { animation: eqJump2 1.1s infinite ease-in-out alternate; }
      .b3 { animation: eqJump3 0.7s infinite ease-in-out alternate; }
      .b4 { animation: eqJump4 0.95s infinite ease-in-out alternate; }
      .font-code { font-family: 'Consolas', 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="850" height="140" rx="14" fill="#060913" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Left Info -->
  <g transform="translate(30, 45)">
    <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="bold" class="font-code" letter-spacing="2">TONE.JS AUDIO KINETIC ENGINE</text>
    <text x="0" y="24" fill="#f8fafc" font-size="18" font-weight="800" class="font-code">PROCEDURAL HARMONICS</text>
    <text x="0" y="46" fill="#94a3b8" font-size="11" class="font-code">432Hz Carrier · PolySynth · Solfeggio Matrix</text>
  </g>

  <!-- Spectrum Bars Container -->
  <g transform="translate(420, 0)" fill="url(#eqGrad)">
    <rect x="0" y="105" width="8" height="15" rx="3" class="b1" style="animation-delay: 0.1s"/>
    <rect x="14" y="100" width="8" height="20" rx="3" class="b2" style="animation-delay: 0.25s"/>
    <rect x="28" y="95" width="8" height="25" rx="3" class="b3" style="animation-delay: 0.05s"/>
    <rect x="42" y="105" width="8" height="15" rx="3" class="b4" style="animation-delay: 0.3s"/>
    <rect x="56" y="90" width="8" height="30" rx="3" class="b1" style="animation-delay: 0.4s"/>
    <rect x="70" y="85" width="8" height="35" rx="3" class="b3" style="animation-delay: 0.15s"/>
    <rect x="84" y="95" width="8" height="25" rx="3" class="b2" style="animation-delay: 0.5s"/>
    <rect x="98" y="80" width="8" height="40" rx="3" class="b4" style="animation-delay: 0.2s"/>
    <rect x="112" y="75" width="8" height="45" rx="3" class="b1" style="animation-delay: 0.6s"/>
    <rect x="126" y="85" width="8" height="35" rx="3" class="b3" style="animation-delay: 0.35s"/>
    <rect x="140" y="90" width="8" height="30" rx="3" class="b2" style="animation-delay: 0.1s"/>
    <rect x="154" y="98" width="8" height="22" rx="3" class="b4" style="animation-delay: 0.45s"/>
    <rect x="168" y="92" width="8" height="28" rx="3" class="b1" style="animation-delay: 0.25s"/>
    <rect x="182" y="82" width="8" height="38" rx="3" class="b3" style="animation-delay: 0.05s"/>
    <rect x="196" y="88" width="8" height="32" rx="3" class="b2" style="animation-delay: 0.3s"/>
    <rect x="210" y="100" width="8" height="20" rx="3" class="b4" style="animation-delay: 0.55s"/>
    <rect x="224" y="105" width="8" height="15" rx="3" class="b1" style="animation-delay: 0.4s"/>
    <rect x="238" y="108" width="8" height="12" rx="3" class="b3" style="animation-delay: 0.15s"/>
  </g>
</svg>

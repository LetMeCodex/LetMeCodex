<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes waveDraw { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -120; } }
      @keyframes sparkCycle { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .inter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .pulse-dot { animation: pulseGlow 1.8s infinite ease-in-out; }
      .wave-path { stroke-dasharray: 4 3; animation: waveDraw 6s linear infinite; }
      .spark { animation: sparkCycle 1.2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Container Base Card -->
  <rect width="850" height="160" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Topbar Header -->
  <rect x="0" y="0" width="850" height="42" rx="8" fill="#161B22"/>
  <rect x="0" y="34" width="850" height="8" fill="#161B22"/>
  <line x1="0" y1="42" x2="850" y2="42" stroke="#30363D" stroke-width="1"/>

  <!-- Topbar Left: Logo and Live Status -->
  <g transform="translate(20, 15)">
    <!-- Pulse Line Logo -->
    <path d="M 0 12 L 6 12 L 9 2 L 13 22 L 17 8 L 20 16 L 23 12 L 30 12" fill="none" stroke="#3FB950" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="38" y="15" class="inter" fill="#F0F6FC" font-size="13" font-weight="600" letter-spacing="0.5">Autonomous Pulse</text>

    <!-- Live Status Pill -->
    <g transform="translate(170, 2)">
      <circle cx="6" cy="11" r="3.5" fill="#3FB950" class="pulse-dot"/>
      <circle cx="6" cy="11" r="1.5" fill="#FFFFFF"/>
      <text x="16" y="15" class="mono" fill="#7D8590" font-size="11">Live • IST Synced</text>
    </g>
  </g>

  <!-- Topbar Right: Telemetry Breadcrumbs -->
  <g transform="translate(540, 26)" class="mono" font-size="11">
    <text x="0" y="0" fill="#7D8590">FREQ: <tspan fill="#3FB950" font-weight="600">1.24 Hz</tspan></text>
    <text x="95" y="0" fill="#30363D">|</text>
    <text x="110" y="0" fill="#7D8590">ZONE: <tspan fill="#F0F6FC">IST (UTC+5:30)</tspan></text>
  </g>

  <!-- Repo Action Bar -->
  <g transform="translate(20, 60)">
    <!-- Live Pulse Badge -->
    <rect x="0" y="0" width="84" height="22" rx="11" fill="rgba(35, 134, 54, 0.15)" stroke="rgba(35, 134, 54, 0.4)" stroke-width="1"/>
    <circle cx="10" cy="11" r="2.5" fill="#3FB950" class="pulse-dot"/>
    <text x="18" y="15" class="mono" fill="#3FB950" font-size="10" font-weight="700" letter-spacing="0.5">LIVE PULSE</text>

    <text x="94" y="15" class="mono" fill="#30363D">/</text>

    <!-- Octocat Icon -->
    <g transform="translate(108, 3)">
      <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" fill="#F0F6FC" transform="scale(0.95)"/>
    </g>

    <!-- Repo Name and Badges -->
    <text x="132" y="15" class="inter" fill="#F0F6FC" font-size="13" font-weight="600">LetMeCodex</text>
    <text x="214" y="15" class="mono" fill="#7D8590">/</text>
    <text x="228" y="15" class="inter" fill="#7D8590" font-size="13">autonomous</text>

    <!-- Public Badge -->
    <rect x="318" y="1" width="46" height="18" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="325" y="13" class="mono" fill="#7D8590" font-size="10">public</text>

    <!-- Branch Main Badge -->
    <g transform="translate(376, 2)">
      <path d="M5.5 2a1.5 1.5 0 1 1 2 1.415V6a2 2 0 0 1-2 2H4a1 1 0 0 0-1 1v1.128a2 2 0 1 1-1 0V5.372A2 2 0 0 1 3.5 3.5h.5V3.415A1.5 1.5 0 0 1 5.5 2Z" fill="#7D8590" transform="scale(0.9)"/>
      <text x="14" y="11" class="mono" fill="#7D8590" font-size="11">main</text>
    </g>

    <!-- ASCII Sparkline on Right -->
    <g transform="translate(710, 0)">
      <rect x="0" y="-4" width="100" height="28" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="12" y="14" class="mono spark" fill="#3FB950" font-size="12" font-weight="700" letter-spacing="2"> ▄█▀█▄ </text>
    </g>
  </g>

  <!-- Subtitle and Poisson Engine Description -->
  <g transform="translate(20, 115)">
    <text x="0" y="0" class="mono" fill="#7D8590" font-size="11">
      <tspan fill="#3FB950">●</tspan> AUTONOMOUS TELEMETRY ENGINE · WORKFLOW DISPATCH · CADENCE: POISSON-OGATA
    </text>
    <text x="0" y="20" class="inter" fill="#7D8590" font-size="12">
      Autonomous telemetry monitor tracking scheduled repository workflows, algorithmic benchmarks, and multi-source technical streams in real time.
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 90" width="100%" height="100%">
  <defs>
    <style>
      @keyframes flamePulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .inter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .flame-dot { animation: flamePulse 1.6s infinite ease-in-out; transform-origin: center; }
    </style>
  </defs>

  <!-- 6 Grid Columns: Width 134 each, Gap 9px -> Total = 6*134 + 5*9 = 804 + 45 = 849 -->
  
  <!-- Tile 1: Previous Run -->
  <g transform="translate(0, 0)">
    <rect width="134" height="90" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <g transform="translate(12, 14)">
      <!-- Clock Icon -->
      <circle cx="6" cy="6" r="5" fill="none" stroke="#7D8590" stroke-width="1.2"/>
      <path d="M6 3.5 V6 H8" fill="none" stroke="#7D8590" stroke-width="1.2" stroke-linecap="round"/>
      <text x="16" y="10" class="mono" fill="#7D8590" font-size="11">Previous Run</text>

      <text x="0" y="38" class="mono" fill="#F0F6FC" font-size="13" font-weight="600">08:18 PM</text>
      <text x="0" y="54" class="mono" fill="#3FB950" font-size="10">● IST Synced</text>
    </g>
  </g>

  <!-- Tile 2: Duration -->
  <g transform="translate(143, 0)">
    <rect width="134" height="90" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <g transform="translate(12, 14)">
      <!-- Timer Icon -->
      <circle cx="6" cy="6" r="5" fill="none" stroke="#7D8590" stroke-width="1.2"/>
      <line x1="6" y1="3" x2="6" y2="6" stroke="#7D8590" stroke-width="1.2"/>
      <text x="16" y="10" class="mono" fill="#7D8590" font-size="11">Duration</text>

      <text x="0" y="38" class="mono" fill="#F0F6FC" font-size="13" font-weight="600">~7.8s</text>
      <text x="0" y="54" class="mono" fill="#7D8590" font-size="10">Workflow Cycle</text>
    </g>
  </g>

  <!-- Tile 3: Today's Commits -->
  <g transform="translate(286, 0)">
    <rect width="134" height="90" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <g transform="translate(12, 14)">
      <!-- Commit Icon -->
      <circle cx="6" cy="6" r="3" fill="none" stroke="#3FB950" stroke-width="1.5"/>
      <line x1="0" y1="6" x2="3" y2="6" stroke="#3FB950" stroke-width="1.5"/>
      <line x1="9" y1="6" x2="12" y2="6" stroke="#3FB950" stroke-width="1.5"/>
      <text x="16" y="10" class="mono" fill="#7D8590" font-size="11">Today Commits</text>

      <text x="0" y="38" class="mono" fill="#3FB950" font-size="13" font-weight="700">Active</text>
      <text x="0" y="54" class="mono" fill="#3FB950" font-size="10">Level 4 Pace</text>
    </g>
  </g>

  <!-- Tile 4: Quartile Target -->
  <g transform="translate(429, 0)">
    <rect width="134" height="90" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <g transform="translate(12, 14)">
      <!-- Target Bullseye -->
      <circle cx="6" cy="6" r="5" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
      <circle cx="6" cy="6" r="2" fill="#38BDF8"/>
      <text x="16" y="10" class="mono" fill="#7D8590" font-size="11">Quartile Target</text>

      <text x="0" y="38" class="mono" fill="#38BDF8" font-size="13" font-weight="600">≥ 58 Commits</text>
      <text x="0" y="54" class="mono" fill="#7D8590" font-size="10">L4 = ⌈0.75 × Max⌉</text>
    </g>
  </g>

  <!-- Tile 5: Active Streak -->
  <g transform="translate(572, 0)">
    <rect width="134" height="90" rx="6" fill="#161B22" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
    <g transform="translate(12, 14)">
      <!-- Flame Icon -->
      <path d="M6 1 C6 1 8 3.5 8 5.5 C8 7 6.8 8.5 5 8.5 C3.2 8.5 2 7 2 5.5 C2 3.8 3.5 2.5 4 1.5 C4.5 2.8 5.5 3.5 6 1 Z" fill="#F59E0B"/>
      <text x="14" y="9" class="mono" fill="#F59E0B" font-size="11" font-weight="700">Streak</text>
      <rect x="76" y="-3" width="34" height="15" rx="3" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="80" y="8" class="mono" fill="#F59E0B" font-size="9" font-weight="700">4.2x</text>

      <text x="0" y="38" class="mono" fill="#F59E0B" font-size="13" font-weight="700">42 Days</text>
      <circle cx="65" cy="34" r="3" fill="#F59E0B" class="flame-dot"/>
      <text x="0" y="54" class="mono" fill="#7D8590" font-size="10">Solar Supernova</text>
    </g>
  </g>

  <!-- Tile 6: Latest SHA -->
  <g transform="translate(715, 0)">
    <rect width="135" height="90" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <g transform="translate(12, 14)">
      <!-- Git Branch Icon -->
      <path d="M5.5 2a1.5 1.5 0 1 1 2 1.415V6a2 2 0 0 1-2 2H4a1 1 0 0 0-1 1v1.128a2 2 0 1 1-1 0V5.372A2 2 0 0 1 3.5 3.5h.5V3.415A1.5 1.5 0 0 1 5.5 2Z" fill="#7D8590"/>
      <text x="16" y="10" class="mono" fill="#7D8590" font-size="11">Latest SHA</text>

      <text x="0" y="38" class="mono" fill="#79C0FF" font-size="13" font-weight="600">c8f1e2a</text>
      <text x="0" y="54" class="mono" fill="#7D8590" font-size="10">origin/main</text>
    </g>
  </g>
</svg>

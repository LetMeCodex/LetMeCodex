<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 76" width="100%" height="100%">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#78350F" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="outerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="45%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="midGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <style><![CDATA[
      /* 1. Heat Aura Breathing */
      @keyframes heatAura {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.14); opacity: 1; }
      }

      /* 2. Base Sway */
      @keyframes baseSway {
        0%, 100% { transform: scaleY(1) skewX(0deg); }
        50% { transform: scaleY(1.03) skewX(1.2deg); }
      }

      /* 3. Center Flame Upward Surge and Turbulence */
      @keyframes centerSurge {
        0%, 100% { transform: scaleY(1) translateY(0) skewX(0deg); }
        25% { transform: scaleY(1.15) translateY(-26px) skewX(2.5deg); }
        50% { transform: scaleY(0.92) translateY(6px) skewX(-2deg); }
        75% { transform: scaleY(1.1) translateY(-18px) skewX(1.8deg); }
      }

      /* 4. Left Flank Lick and Whip */
      @keyframes lickLeft {
        0%, 100% { transform: rotate(0deg) scale(1) translateY(0); }
        35% { transform: rotate(-8deg) scaleY(1.16) translateY(-24px) skewX(-4deg); }
        70% { transform: rotate(3deg) scaleY(0.92) translateY(6px) skewX(2deg); }
      }

      /* 5. Right Flank Lick and Whip */
      @keyframes lickRight {
        0%, 100% { transform: rotate(0deg) scale(1) translateY(0); }
        40% { transform: rotate(8deg) scaleY(1.15) translateY(-22px) skewX(4deg); }
        75% { transform: rotate(-3deg) scaleY(0.93) translateY(5px) skewX(-2deg); }
      }

      /* 6. Mid Layer Rapid Asymmetric Flutter */
      @keyframes midFlutter {
        0%, 100% { transform: scaleY(1) skewX(0deg); opacity: 0.95; }
        30% { transform: scaleY(1.14) translateY(-18px) skewX(-3deg); opacity: 1; }
        65% { transform: scaleY(0.92) translateY(6px) skewX(3deg); opacity: 0.88; }
      }

      /* 7. Hearth Core Rapid White-Hot Throbbing */
      @keyframes coreThrob {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        30% { transform: scale(1.18) translateY(-6px); opacity: 1; }
        70% { transform: scale(0.92) translateY(3px); opacity: 0.85; }
      }

      /* 8. Rising Flame Wisp 1 (Center Surge) */
      @keyframes riseWisp1 {
        0% { transform: translateY(30px) scale(0.8); opacity: 0; }
        20% { opacity: 0.9; }
        65% { opacity: 0.6; }
        100% { transform: translateY(-220px) scale(0.3); opacity: 0; }
      }

      /* 9. Rising Flame Wisp 2 (Left Surge) */
      @keyframes riseWisp2 {
        0% { transform: translate(0, 40px) scale(0.8); opacity: 0; }
        25% { opacity: 0.85; }
        65% { opacity: 0.5; }
        100% { transform: translate(-35px, -200px) scale(0.25); opacity: 0; }
      }

      /* 10. Rising Flame Wisp 3 (Right Surge) */
      @keyframes riseWisp3 {
        0% { transform: translate(0, 40px) scale(0.8); opacity: 0; }
        25% { opacity: 0.85; }
        65% { opacity: 0.5; }
        100% { transform: translate(35px, -190px) scale(0.25); opacity: 0; }
      }

      /* 11. Rising Flame Wisp 4 (High Core Surge) */
      @keyframes riseWisp4 {
        0% { transform: translateY(20px) scale(0.9); opacity: 0; }
        20% { opacity: 0.95; }
        60% { opacity: 0.6; }
        100% { transform: translateY(-260px) scale(0.2); opacity: 0; }
      }

      /* 12. Top-Left Detached Spark (Whipping & Floating) */
      @keyframes sparkWhip {
        0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.95; }
        25% { transform: translate(-10px, -24px) rotate(-12deg) scale(1.12); opacity: 0.8; }
        50% { transform: translate(-4px, -45px) rotate(6deg) scale(0.85); opacity: 0.5; }
        75% { transform: translate(-12px, -26px) rotate(-6deg) scale(0.95); opacity: 0.9; }
      }

      /* 13. Floating Embers Ascending */
      @keyframes emberAscent {
        0% { transform: translate(0, 0); opacity: 0.95; }
        50% { transform: translate(var(--dx, -4px), -26px); opacity: 0.65; }
        100% { transform: translate(calc(var(--dx, -4px) * 2), -56px); opacity: 0; }
      }

      /* 14. High Sparks Ascending */
      @keyframes sparkRiseHigh {
        0% { transform: translate(0, 0) scale(1); opacity: 0.95; }
        40% { opacity: 0.7; }
        100% { transform: translate(-18px, -120px) scale(0.2); opacity: 0; }
      }
      @keyframes sparkRiseRight {
        0% { transform: translate(0, 0) scale(1); opacity: 0.9; }
        40% { opacity: 0.65; }
        100% { transform: translate(18px, -110px) scale(0.2); opacity: 0; }
      }

      .heat-aura-pulse { transform-origin: -11px 0px; animation: heatAura 2s infinite ease-in-out; }
      .flame-sway-base { transform-origin: -11px 192px; animation: baseSway 2.2s infinite ease-in-out; }
      .flame-surge-center { transform-origin: -11px 192px; animation: centerSurge 1.05s infinite ease-in-out; }
      .flame-lick-left-flank { transform-origin: -60px 150px; animation: lickLeft 1.25s infinite ease-in-out; }
      .flame-lick-right-flank { transform-origin: 50px 150px; animation: lickRight 1.35s infinite ease-in-out; animation-delay: -0.4s; }
      .flame-mid-flutter { transform-origin: -11px 180px; animation: midFlutter 0.85s infinite ease-in-out; }
      .flame-core-pulse { transform-origin: -11px 160px; animation: coreThrob 0.65s infinite ease-in-out; }
      
      .rising-wisp-1 { transform-origin: -11px -20px; animation: riseWisp1 1.25s infinite linear; }
      .rising-wisp-2 { transform-origin: -35px 20px; animation: riseWisp2 1.55s infinite linear; animation-delay: -0.5s; }
      .rising-wisp-3 { transform-origin: 40px 30px; animation: riseWisp3 1.65s infinite linear; animation-delay: -1.0s; }
      .rising-wisp-4 { transform-origin: -11px 0px; animation: riseWisp4 1.15s infinite linear; animation-delay: -0.3s; }
      
      .spark-whipping-anim { transform-origin: -81px -212px; animation: sparkWhip 1.5s infinite ease-in-out; }
      .spark-rise-left { animation: sparkRiseHigh 1.4s infinite ease-out; animation-delay: -0.4s; }
      .spark-rise-right { animation: sparkRiseRight 1.7s infinite ease-out; animation-delay: -1.0s; }
      .ember-particle { animation: emberAscent 1.6s infinite ease-out; }

      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .inter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    ]]></style>
  </defs>

  <!-- Clean Minimal Frame (76px Height) -->
  <rect width="920" height="76" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Left: The Living Turbulent Flame Animation (Exact 1017 Design) -->
  <g transform="translate(48, 38)">
    <circle cx="-16" cy="16" r="1.5" fill="#F59E0B" class="ember-particle" style="--dx: -7px; animation-duration: 1.4s; animation-delay: 0s;" />
      <circle cx="-24" cy="12" r="1.2" fill="#F59E0B" class="ember-particle" style="--dx: -12px; animation-duration: 1.9s; animation-delay: 0.3s;" />
      <circle cx="-7" cy="18" r="1.6" fill="#F59E0B" class="ember-particle" style="--dx: -3px; animation-duration: 1.5s; animation-delay: 0.8s;" />
      <circle cx="8" cy="15" r="1.7" fill="#F59E0B" class="ember-particle" style="--dx: 6px; animation-duration: 1.3s; animation-delay: 0.1s;" />
      <circle cx="20" cy="11" r="1.3" fill="#F59E0B" class="ember-particle" style="--dx: 10px; animation-duration: 2s; animation-delay: 0.6s;" />
      <circle cx="0" cy="20" r="1.8" fill="#F59E0B" class="ember-particle" style="--dx: 3px; animation-duration: 1.6s; animation-delay: 1.1s;" />
      <circle cx="-12" cy="8" r="1.1" fill="#F59E0B" class="ember-particle" style="--dx: -5px; animation-duration: 1.7s; animation-delay: 1.4s;" />
    
    <g class="flame-master" transform="scale(0.135)">
      <!-- Pulsing Aura Heat Glow -->
      <circle cx="-11" cy="0" r="240" fill="url(#auraGlow)" class="heat-aura-pulse" />

      

      

      <!-- Shadow & Base Foundation -->
      <g class="flame-sway-base" opacity="0.45">
        <path fill="#78350F" d="M-11.648,-198.368 C-42.315,-49.21 -191.842,-7.631 -11,192 C136.105,-1.263 65.263,-120 -11.648,-198.368z"/>
        <path stroke="#F59E0B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3" d="M-11.648,-198.368 C-42.315,-49.21 -191.842,-7.631 -11,192 C136.105,-1.263 65.263,-120 -11.648,-198.368z"/>
      </g>

      <!-- Center Main Tongue (Vigorous Upward Surge) -->
      <g class="flame-surge-center">
        <path fill="url(#outerGrad)" d="M-11.648,-198.368 C-42.315,-49.21 -191.842,-7.631 -11,192 C136.105,-1.263 65.263,-120 -11.648,-198.368z"/>
        <path fill="url(#outerGrad)" d="M-36.898,-145.17 C-101.993,-71.701 -126.604,15.347 -11,192 C115.073,-14.97 -61.444,-36.548 -36.898,-145.17z"/>
        <path fill="url(#outerGrad)" d="M-36.898,-145.17 C-29.625,-141.125 -8.262,-154.805 -11.627,-198.246 C2.443,-53.713 -69.323,-90.814 -36.898,-145.17z"/>
      </g>

      <!-- Left Flank Tongues (Flicks Outward Left & Up) -->
      <g class="flame-lick-left-flank">
        <path fill="url(#outerGrad)" d="M-107.023,-59.32 C-166.38,13.28 -113.38,144.70 -11,192 C81.5,-23.5 -116.16,47.34 -107.023,-59.32z"/>
        <path fill="url(#outerGrad)" d="M-135.05,84.36 C-148.51,123.68 -85.94,192 -11,192 C17.15,68.55 -110.18,126.14 -135.05,84.36z"/>
        <path fill="url(#outerGrad)" d="M-88.60,158.17 C-68.90,166.72 -65,192 -11,192 C-21.72,149.02 -65.19,155.08 -88.60,158.17z"/>
      </g>

      <!-- Right Flank Tongues (Flicks Outward Right & Up) -->
      <g class="flame-lick-right-flank">
        <path fill="url(#outerGrad)" d="M108.98,-59.68 C75.36,10.05 -46.55,2.52 -11,192 C122.73,140.84 144.78,40.84 108.98,-59.68z"/>
        <path fill="url(#outerGrad)" d="M121.36,118.23 C75,114.89 -10.79,121.61 -11,192 C87.47,192 107.68,134.94 121.36,118.23z"/>
        <path fill="url(#outerGrad)" d="M30.97,176.34 C14.27,167.16 -10.95,175.79 -11.04,191.24 C15.45,191.24 24.57,172.66 30.97,176.34z"/>
      </g>

      <!-- Middle Flame Layer (Rapid Asynchronous Flutter) -->
      <g class="flame-mid-flutter">
        <path fill="url(#midGrad)" d="M-11,192 C95.52,-18.31 32.10,-80.47 -8.70,-156.68 C-20.73,-86.36 -137.36,-109.73 -11,192z"/>
        <path fill="url(#midGrad)" d="M-11,192 C91.10,134.84 87.78,21.68 89.94,-18.17 C66.10,16.26 -35.5,-26.39 -11,192z"/>
        <path fill="url(#midGrad)" d="M-11,192 C72.68,161 101.84,113.57 103.95,90.03 C80.63,96 0.10,82.63 -11,192z"/>
        <path fill="url(#midGrad)" d="M-11,192 C59.28,192 51.13,153.18 76.98,142.36 C51.55,130.44 -9.80,147.38 -11,192z"/>
        <path fill="url(#midGrad)" d="M-8.17,-154.36 C-34.65,101.78 66.13,95 89.94,-18.17 C82.97,-8.24 71.32,-5.95 59.66,-8.89 C26.23,-14.98 49.89,-80.47 -8.17,-154.36z"/>
        <path fill="url(#midGrad)" d="M-11,192 C7.32,-10.82 -77.20,70.96 -109.08,-4.89 C-134.87,51.84 -72.07,131.74 -11,192z"/>
        <path fill="url(#midGrad)" d="M-11,192 C-11,76.50 -65.35,143.31 -101.39,111.51 C-97.47,164.05 -49.62,192 -11,192z"/>
        <path fill="url(#midGrad)" d="M-56.93,-80.83 C-66.55,-59.58 -58.92,-19.35 -69.43,0.08 C-76.84,13.80 -96.81,13.31 -108.98,-4.99 C-126.03,76.33 2.02,102.01 -56.93,-80.83z"/>
      </g>

      <!-- Translucent Gloss Layer -->
      <g opacity="0.32" class="flame-mid-flutter" style="animation-delay: -0.35s;">
        <path fill="#FDE047" d="M-0.026,-98.88 C0.157,-47.05 -108,-67.78 -12,192.42 C44.68,101.84 31.31,-9.47 -0.026,-98.88z M57.63,23.73 C49.08,31.12 24.81,33.76 21.16,7.69 C17.16,-21.13 -31.30,63.64 -12,192.42 C28.84,120.26 84.57,116.94 57.63,23.73z M-80.12,54.82 C-84.81,113.66 -41.15,143.19 -12,192.42 C-9.15,136.64 -42.23,10.05 -47.53,30.36 C-49.09,64.02 -64.24,57.06 -80.12,54.82z"/>
      </g>

      <!-- Core Hearth Layer (Rapid White-Hot Pulse) -->
      <g class="flame-core-pulse">
        <path fill="url(#coreGrad)" d="M-5.87,-22.27 C-12.09,25.84 -77.88,36.63 -12,192.42 C74.23,64.59 -12.02,43.79 -5.87,-22.27z"/>
        <path fill="url(#coreGrad)" d="M42.90,56.23 C28.57,82.21 -28.19,74.48 -12,192.42 C27.07,145.77 36.23,140.23 42.90,56.23z"/>
        <path fill="url(#coreGrad)" d="M70.01,103.60 C43.15,112.26 -16.5,82.5 -12,192.42 C32.23,165.57 57.68,133.5 70.01,103.60z"/>
        <path fill="url(#coreGrad)" d="M-61.02,87.46 C-65.47,104.16 -62.65,139.36 -12,192.42 C15.22,90.81 -43.62,102.51 -61.02,87.46z"/>
        <path fill="url(#coreGrad)" d="M-60.80,142.56 C-53.52,154.91 -54.20,178.63 -12,192.42 C-3.07,138.74 -41.61,137.68 -60.80,142.56z"/>
      </g>

      <!-- Incandescent Center Core Hotspot -->
      <ellipse cx="-11" cy="142" rx="14" ry="24" fill="#FFFFFF" class="flame-core-pulse" />

      <!-- Active Rising Flames & Sparks -->
      
    <!-- Rising Flame Wisp 1 (Center High Surge) -->
    <path class="rising-wisp-1" fill="url(#midGrad)"
          d="M-11.6,-140 C-24,-110 -36,-80 -11,-20 C14,-80 2,-110 -11.6,-140 Z"/>

    <!-- Rising Flame Wisp 2 (Left Flank Surge) -->
    <path class="rising-wisp-2" fill="url(#outerGrad)"
          d="M-45,-70 C-58,-50 -65,-20 -35,20 C-20,-20 -35,-50 -45,-70 Z"/>

    <!-- Rising Flame Wisp 3 (Right Flank Surge) -->
    <path class="rising-wisp-3" fill="url(#outerGrad)"
          d="M35,-50 C20,-30 15,0 40,30 C52,0 45,-30 35,-50 Z"/>

    <!-- Rising Flame Wisp 4 (Core White-Gold Surging Tongue) -->
    <path class="rising-wisp-4" fill="url(#coreGrad)"
          d="M-11.6,-90 C-18,-60 -22,-30 -11,0 C0,-30 -5,-60 -11.6,-90 Z"/>

    <!-- Signature Detached Floating Spark (Layer 75) -->
    <g class="spark-whipping-anim">
      <path fill="#F59E0B" d="M-81.61,-212.15 C-78.53,-191.03 -118.03,-193.80 -97.59,-151.04 C-97.08,-151.74 -96.45,-152.17 -95.86,-152.01 C-68.61,-174.70 -66.37,-195.21 -81.61,-212.15z"/>
      <path stroke="#FDE047" stroke-width="6" fill="none" opacity="0.8" d="M-81.61,-212.15 C-78.53,-191.03 -118.03,-193.80 -97.59,-151.04 C-97.08,-151.74 -96.45,-152.17 -95.86,-152.01 C-68.61,-174.70 -66.37,-195.21 -81.61,-212.15z"/>
    </g>

    <!-- Secondary Rising Sparks -->
    <circle cx="45" cy="-70" r="10" fill="#FDE047" class="spark-rise-right"/>
    <circle cx="-35" cy="-90" r="9" fill="#FFFFFF" class="spark-rise-left"/>
  
    </g>
  
  </g>

  <!-- Left Center: Streak Count & Tier Tag -->
  <g transform="translate(88, 0)">
    <text x="0" y="49" class="inter" fill="#F0F6FC" font-size="34" font-weight="800" letter-spacing="-1">10</text>
    <text x="50" y="36" class="inter" fill="#F59E0B" font-size="13" font-weight="700" letter-spacing="0.5">DAYS STREAK</text>
    <text x="50" y="52" class="mono" fill="#8B949E" font-size="11" font-weight="500">HOT TIER</text>
  </g>

  <!-- Minimal Divider -->
  <line x1="265" y1="20" x2="265" y2="56" stroke="#21262D" stroke-width="1"/>

  <!-- Longest Streak -->
  <g transform="translate(295, 0)">
    <text x="0" y="36" class="mono" fill="#7D8590" font-size="10" letter-spacing="1">LONGEST STREAK</text>
    <text x="0" y="54" class="inter" fill="#F0F6FC" font-size="15" font-weight="700">10 Days</text>
  </g>
</svg>
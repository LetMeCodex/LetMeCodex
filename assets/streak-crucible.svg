<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="95%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="streakBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <style>
      @keyframes flameTongue1 { 0%, 100% { transform: scaleY(1) translateY(0); opacity: 0.8; } 50% { transform: scaleY(1.35) translateY(-8px); opacity: 1; } }
      @keyframes flameTongue2 { 0%, 100% { transform: scaleY(1) translateY(0); opacity: 0.9; } 50% { transform: scaleY(1.25) translateY(-6px); opacity: 1; } }
      @keyframes flameTongue3 { 0%, 100% { transform: scaleY(1.2) translateY(-4px); opacity: 0.85; } 50% { transform: scaleY(0.9) translateY(2px); opacity: 1; } }
      @keyframes ringCharge { 0% { stroke-dashoffset: 280; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 280; } }

      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .inter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .flame1 { animation: flameTongue1 1.4s infinite ease-in-out; transform-origin: bottom center; }
      .flame2 { animation: flameTongue2 1.8s infinite ease-in-out 0.3s; transform-origin: bottom center; }
      .flame3 { animation: flameTongue3 1.2s infinite ease-in-out 0.6s; transform-origin: bottom center; }
      .charge-ring { stroke-dasharray: 280; animation: ringCharge 4s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="850" height="180" rx="8" fill="#0B0F14" stroke="#30363D" stroke-width="1"/>

  <!-- Left Module: Crucible Core & Live 42-Day Odometer (Width 400) -->
  <g transform="translate(20, 16)">
    <rect width="390" height="148" rx="6" fill="#161B22" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1"/>
    
    <!-- Header -->
    <g transform="translate(16, 20)">
      <circle cx="4" cy="4" r="3.5" fill="#F59E0B"/>
      <text x="14" y="8" class="mono" fill="#F0F6FC" font-size="12" font-weight="700">Crucible Flame Core</text>

      <rect x="230" y="-3" width="128" height="18" rx="3" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
      <text x="236" y="9" class="mono" fill="#F59E0B" font-size="10" font-weight="700">TIER 4: SUPERNOVA</text>
    </g>

    <!-- Animated Flame Vectors -->
    <g transform="translate(48, 85)">
      <!-- Flame 1 Left -->
      <path d="M0 0 C-10 -25 -5 -40 0 -55 C5 -40 10 -25 0 0 Z" fill="url(#flameGrad)" class="flame1"/>
      <!-- Flame 2 Center -->
      <path d="M12 0 C-4 -30 4 -50 12 -70 C20 -50 28 -30 12 0 Z" fill="url(#flameGrad)" class="flame2"/>
      <!-- Flame 3 Right -->
      <path d="M24 0 C14 -20 18 -35 24 -48 C30 -35 34 -20 24 0 Z" fill="url(#flameGrad)" class="flame3"/>
    </g>

    <!-- Odometer Number -->
    <g transform="translate(115, 82)">
      <text x="0" y="0" class="mono" fill="#F0F6FC" font-size="44" font-weight="900" letter-spacing="-1">42</text>
      <text x="58" y="-12" class="mono" fill="#F59E0B" font-size="13" font-weight="800">DAYS</text>
      <text x="58" y="4" class="mono" fill="#7D8590" font-size="10">Consecutive IST</text>
    </g>

    <!-- Bottom Progress Meter -->
    <g transform="translate(16, 122)">
      <rect width="358" height="6" rx="3" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <rect width="250" height="6" rx="3" fill="url(#streakBarGrad)"/>
      <text x="0" y="18" class="mono" fill="#7D8590" font-size="9">Tier 4: Supernova (30d)</text>
      <text x="358" y="18" text-anchor="end" class="mono" fill="#F59E0B" font-size="9" font-weight="600">Next: Godlike (60d)</text>
    </g>
  </g>

  <!-- Right Module: Hold-to-Charge & Milestone Presets (Width 400) -->
  <g transform="translate(430, 16)">
    <rect width="400" height="148" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>

    <!-- Header -->
    <g transform="translate(16, 20)">
      <text x="0" y="8" class="mono" fill="#E6EDF3" font-size="12" font-weight="700">⚡ Kinetic Milestone Engine</text>
      <text x="250" y="8" class="mono" fill="#F59E0B" font-size="11" font-weight="700">4.20x BOOST</text>
    </g>

    <!-- 6 Preset Badges (From Autonomous Pulse Milestone Scrubber) -->
    <g transform="translate(16, 44)">
      <!-- 7d Spark -->
      <rect x="0" y="0" width="56" height="34" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="8" y="14" class="mono" fill="#38BDF8" font-size="10" font-weight="700">7d</text>
      <text x="8" y="27" class="mono" fill="#7D8590" font-size="9">1.85x</text>

      <!-- 14d Blaze -->
      <rect x="62" y="0" width="56" height="34" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="70" y="14" class="mono" fill="#A855F7" font-size="10" font-weight="700">14d</text>
      <text x="70" y="27" class="mono" fill="#7D8590" font-size="9">2.75x</text>

      <!-- 30d Inferno -->
      <rect x="124" y="0" width="56" height="34" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="132" y="14" class="mono" fill="#F59E0B" font-size="10" font-weight="700">30d</text>
      <text x="132" y="27" class="mono" fill="#7D8590" font-size="9">4.20x</text>

      <!-- 42d Current (Active Gold Glow) -->
      <rect x="186" y="0" width="58" height="34" rx="4" fill="#21262D" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="193" y="14" class="mono" fill="#F59E0B" font-size="10" font-weight="800">42d ★</text>
      <text x="193" y="27" class="mono" fill="#F59E0B" font-size="9" font-weight="700">Active</text>

      <!-- 60d Cosmic -->
      <rect x="250" y="0" width="56" height="34" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="258" y="14" class="mono" fill="#EC4899" font-size="10" font-weight="700">60d</text>
      <text x="258" y="27" class="mono" fill="#7D8590" font-size="9">4.80x</text>

      <!-- 100d Godlike -->
      <rect x="312" y="0" width="56" height="34" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="319" y="14" class="mono" fill="#FDE047" font-size="10" font-weight="700">100d</text>
      <text x="319" y="27" class="mono" fill="#7D8590" font-size="9">5.00x</text>
    </g>

    <!-- Capacitor Status & Shepard Tone Specs -->
    <g transform="translate(16, 102)" class="mono" font-size="10">
      <rect width="368" height="34" rx="4" fill="#0D1117" stroke="#21262D"/>
      <text x="12" y="16" fill="#7D8590">STATUS: <tspan fill="#3FB950" font-weight="700">● PROTECTED REPUTATION</tspan></text>
      <text x="210" y="16" fill="#7D8590">HAPTIC JOLT: <tspan fill="#38BDF8">ACTIVE</tspan></text>
      <text x="12" y="28" fill="#7D8590">QUARTILE TARGET: <tspan fill="#F0F6FC">Level 4 (≥58 Commits)</tspan></text>
      <text x="210" y="28" fill="#7D8590">CADENCE: <tspan fill="#F59E0B">POISSON-OGATA</tspan></text>
    </g>
  </g>
</svg>

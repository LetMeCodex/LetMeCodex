<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="30%" stop-color="#D97706"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="90%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="streakBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes flameDance1 { 0%, 100% { transform: scaleY(1); opacity: 0.85; } 50% { transform: scaleY(1.2) translateY(-2px); opacity: 1; } }
      @keyframes flameDance2 { 0%, 100% { transform: scaleY(1); opacity: 0.95; } 50% { transform: scaleY(1.15) translateY(-3px); opacity: 1; } }
      @keyframes flameDance3 { 0%, 100% { transform: scaleY(1.1) translateY(-1px); opacity: 0.9; } 50% { transform: scaleY(0.95) translateY(1px); opacity: 0.85; } }
      @keyframes sparkEmber { 0% { transform: translateY(0); opacity: 0.8; } 100% { transform: translateY(-16px); opacity: 0; } }

      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .inter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .flame-left { animation: flameDance1 1.2s infinite ease-in-out; transform-origin: 75px 68px; }
      .flame-mid { animation: flameDance2 1.5s infinite ease-in-out 0.2s; transform-origin: 80px 68px; }
      .flame-right { animation: flameDance3 1.1s infinite ease-in-out 0.4s; transform-origin: 85px 68px; }
      .ember { animation: sparkEmber 1.4s infinite ease-out; }
    </style>
  </defs>

  <!-- Base Outer Container -->
  <rect width="850" height="180" rx="8" fill="#0B0F14" stroke="#30363D" stroke-width="1"/>

  <!-- LEFT MODULE: Crucible Flame Core and Live 42-Day Odometer (Width 390) -->
  <g transform="translate(20, 16)">
    <rect width="390" height="148" rx="6" fill="#161B22" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1"/>
    
    <!-- Header -->
    <g transform="translate(16, 18)">
      <circle cx="4" cy="4" r="3.5" fill="#F59E0B"/>
      <text x="14" y="8" class="mono" fill="#F0F6FC" font-size="12" font-weight="700">Crucible Flame Core</text>

      <rect x="228" y="-4" width="130" height="18" rx="3" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
      <text x="234" y="8" class="mono" fill="#F59E0B" font-size="10" font-weight="700">TIER 4: SUPERNOVA</text>
    </g>

    <!-- Center Stage: Crucible Flame Pedestal (Left) + Odometer (Right) -->
    <g transform="translate(16, 38)">
      
      <!-- Flame Burner Dish and Contained Flame (Centered cleanly around x=55, y=55) -->
      <g transform="translate(10, 0)">
        <!-- Pedestal base -->
        <ellipse cx="50" cy="52" rx="28" ry="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
        <ellipse cx="50" cy="50" rx="20" ry="4" fill="rgba(245, 158, 11, 0.2)"/>

        <!-- Flame Petals (Base at y=48, top at y=20 - strictly inside viewport) -->
        <path d="M42 48 C36 36 40 28 44 20 C48 30 50 38 42 48 Z" fill="url(#flameGrad)" class="flame-left" filter="url(#flameGlow)"/>
        <path d="M50 48 C42 32 48 16 50 10 C54 18 60 32 50 48 Z" fill="url(#flameGrad)" class="flame-mid" filter="url(#flameGlow)"/>
        <path d="M56 48 C50 36 54 26 58 22 C62 30 64 38 56 48 Z" fill="url(#flameGrad)" class="flame-right" filter="url(#flameGlow)"/>

        <!-- Rising Embers -->
        <circle cx="48" cy="18" r="1.2" fill="#FDE047" class="ember"/>
        <circle cx="53" cy="14" r="1.5" fill="#FFFFFF" class="ember" style="animation-delay: 0.5s"/>
      </g>

      <!-- Live Odometer (x=140 to 350) -->
      <g transform="translate(135, 12)">
        <text x="0" y="36" class="mono" fill="#F0F6FC" font-size="44" font-weight="900" letter-spacing="-1">42</text>
        <text x="62" y="24" class="mono" fill="#F59E0B" font-size="13" font-weight="800">DAYS</text>
        <text x="62" y="38" class="mono" fill="#7D8590" font-size="10">Consecutive IST Execution</text>
      </g>
    </g>

    <!-- Bottom Progress Meter -->
    <g transform="translate(16, 118)">
      <rect width="358" height="6" rx="3" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <rect width="250" height="6" rx="3" fill="url(#streakBarGrad)"/>
      <text x="0" y="18" class="mono" fill="#7D8590" font-size="9">Tier 4: Supernova (30d)</text>
      <text x="358" y="18" text-anchor="end" class="mono" fill="#F59E0B" font-size="9" font-weight="600">Next: Godlike (60d)</text>
    </g>
  </g>

  <!-- RIGHT MODULE: Kinetic Milestone Engine (Width 400) -->
  <g transform="translate(430, 16)">
    <rect width="400" height="148" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>

    <!-- Header -->
    <g transform="translate(16, 18)">
      <text x="0" y="8" class="mono" fill="#E6EDF3" font-size="12" font-weight="700">⚡ Kinetic Milestone Engine</text>
      <text x="260" y="8" class="mono" fill="#F59E0B" font-size="11" font-weight="700">4.20x BOOST</text>
    </g>

    <!-- 6 Milestone Presets -->
    <g transform="translate(16, 42)">
      <!-- 7d Spark -->
      <rect x="0" y="0" width="56" height="34" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="8" y="14" class="mono" fill="#38BDF8" font-size="10" font-weight="700">7d</text>
      <text x="8" y="27" class="mono" fill="#7D8590" font-size="9">1.85x</text>

      <!-- 14d Blaze -->
      <rect x="62" y="0" width="56" height="34" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="70" y="14" class="mono" fill="#A855F7" font-size="10" font-weight="700">14d</text>
      <text x="70" y="27" class="mono" fill="#7D8590" font-size="9">2.75x</text>

      <!-- 30d Inferno -->
      <rect x="124" y="0" width="56" height="34" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="132" y="14" class="mono" fill="#F59E0B" font-size="10" font-weight="700">30d</text>
      <text x="132" y="27" class="mono" fill="#7D8590" font-size="9">4.20x</text>

      <!-- 42d Current ★ (Active Gold Glow) -->
      <rect x="186" y="0" width="58" height="34" rx="4" fill="#21262D" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="193" y="14" class="mono" fill="#F59E0B" font-size="10" font-weight="800">42d ★</text>
      <text x="193" y="27" class="mono" fill="#F59E0B" font-size="9" font-weight="700">Active</text>

      <!-- 60d Cosmic -->
      <rect x="250" y="0" width="56" height="34" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="258" y="14" class="mono" fill="#EC4899" font-size="10" font-weight="700">60d</text>
      <text x="258" y="27" class="mono" fill="#7D8590" font-size="9">4.80x</text>

      <!-- 100d Godlike -->
      <rect x="312" y="0" width="56" height="34" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="319" y="14" class="mono" fill="#FDE047" font-size="10" font-weight="700">100d</text>
      <text x="319" y="27" class="mono" fill="#7D8590" font-size="9">5.00x</text>
    </g>

    <!-- Clean Two-Column Telemetry Box (No Overlaps!) -->
    <g transform="translate(16, 96)" class="mono" font-size="10">
      <rect width="368" height="38" rx="4" fill="#0D1117" stroke="#21262D"/>
      
      <!-- Row 1 -->
      <text x="12" y="16" fill="#7D8590">STATUS: <tspan fill="#3FB950" font-weight="700">● PROTECTED</tspan></text>
      <text x="210" y="16" fill="#7D8590">HAPTIC: <tspan fill="#38BDF8">ACTIVE</tspan></text>
      
      <!-- Row 2 -->
      <text x="12" y="30" fill="#7D8590">TARGET: <tspan fill="#F0F6FC">Level 4 (≥58)</tspan></text>
      <text x="210" y="30" fill="#7D8590">CADENCE: <tspan fill="#F59E0B">POISSON-OGATA</tspan></text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 110" width="100%" height="100%">
  <defs>
    <style>
      @keyframes stageScan {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .inter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .dot-1 { animation: stageScan 2.1s infinite; animation-delay: 0s; }
      .dot-2 { animation: stageScan 2.1s infinite; animation-delay: 0.3s; }
      .dot-3 { animation: stageScan 2.1s infinite; animation-delay: 0.6s; }
      .dot-4 { animation: stageScan 2.1s infinite; animation-delay: 0.9s; }
      .dot-5 { animation: stageScan 2.1s infinite; animation-delay: 1.2s; }
      .dot-6 { animation: stageScan 2.1s infinite; animation-delay: 1.5s; }
      .dot-7 { animation: stageScan 2.1s infinite; animation-delay: 1.8s; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="110" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Subheader -->
  <rect x="0" y="0" width="850" height="28" rx="8" fill="#161B22"/>
  <rect x="0" y="20" width="850" height="8" fill="#161B22"/>
  <line x1="0" y1="28" x2="850" y2="28" stroke="#30363D" stroke-width="1"/>

  <g transform="translate(16, 18)" class="mono" font-size="11">
    <text x="0" y="0" fill="#7D8590">04. EXECUTION PIPELINE STAGES</text>
    <text x="710" y="0" fill="#3FB950" font-weight="600">Sequential Execution Cycle</text>
  </g>

  <!-- 7 Stages: Width 112 each, Gap 7px -> Total 7*112 + 6*7 = 784 + 42 = 826px (Centered with margin 12px) -->
  <g transform="translate(12, 38)">
    
    <!-- Stage 1: TRIGGER -->
    <g transform="translate(0, 0)">
      <rect width="112" height="60" rx="4" fill="#161B22" stroke="#30363D"/>
      <text x="8" y="14" class="mono" fill="#7D8590" font-size="9">01. TRIGGER</text>
      <circle cx="102" cy="11" r="2.5" fill="#3FB950" class="dot-1"/>
      <text x="8" y="32" class="inter" fill="#F0F6FC" font-size="11" font-weight="600">6x Jitter Cron</text>
      <text x="8" y="47" class="mono" fill="#7D8590" font-size="9">IST Synced</text>
    </g>

    <!-- Stage 2: FETCH -->
    <g transform="translate(119, 0)">
      <rect width="112" height="60" rx="4" fill="#161B22" stroke="#30363D"/>
      <text x="8" y="14" class="mono" fill="#7D8590" font-size="9">02. FETCH</text>
      <circle cx="102" cy="11" r="2.5" fill="#3FB950" class="dot-2"/>
      <text x="8" y="32" class="inter" fill="#F0F6FC" font-size="11" font-weight="600">Multi-Stream</text>
      <text x="8" y="47" class="mono" fill="#7D8590" font-size="9">~1.07s Duration</text>
    </g>

    <!-- Stage 3: ANALYZE -->
    <g transform="translate(238, 0)">
      <rect width="112" height="60" rx="4" fill="#161B22" stroke="#30363D"/>
      <text x="8" y="14" class="mono" fill="#7D8590" font-size="9">03. ANALYZE</text>
      <circle cx="102" cy="11" r="2.5" fill="#3FB950" class="dot-3"/>
      <text x="8" y="32" class="inter" fill="#F0F6FC" font-size="11" font-weight="600">Filter &amp; Score</text>
      <text x="8" y="47" class="mono" fill="#7D8590" font-size="9">15 Items/Batch</text>
    </g>

    <!-- Stage 4: GENERATE -->
    <g transform="translate(357, 0)">
      <rect width="112" height="60" rx="4" fill="#161B22" stroke="#30363D"/>
      <text x="8" y="14" class="mono" fill="#7D8590" font-size="9">04. GENERATE</text>
      <circle cx="102" cy="11" r="2.5" fill="#3FB950" class="dot-4"/>
      <text x="8" y="32" class="inter" fill="#F0F6FC" font-size="11" font-weight="600">Frontier MLSys</text>
      <text x="8" y="47" class="mono" fill="#7D8590" font-size="9">Verified Complexity</text>
    </g>

    <!-- Stage 5: WRITE -->
    <g transform="translate(476, 0)">
      <rect width="112" height="60" rx="4" fill="#161B22" stroke="#30363D"/>
      <text x="8" y="14" class="mono" fill="#7D8590" font-size="9">05. WRITE</text>
      <circle cx="102" cy="11" r="2.5" fill="#3FB950" class="dot-5"/>
      <text x="8" y="32" class="inter" fill="#F0F6FC" font-size="11" font-weight="600">State &amp; Digests</text>
      <text x="8" y="47" class="mono" fill="#7D8590" font-size="9">3 Files Changed</text>
    </g>

    <!-- Stage 6: COMMIT -->
    <g transform="translate(595, 0)">
      <rect width="112" height="60" rx="4" fill="#161B22" stroke="#30363D"/>
      <text x="8" y="14" class="mono" fill="#7D8590" font-size="9">06. COMMIT</text>
      <circle cx="102" cy="11" r="2.5" fill="#3FB950" class="dot-6"/>
      <text x="8" y="32" class="inter" fill="#F0F6FC" font-size="11" font-weight="600">LetMeCodex</text>
      <text x="8" y="47" class="mono" fill="#7D8590" font-size="9">16-24/Session</text>
    </g>

    <!-- Stage 7: PUSH -->
    <g transform="translate(714, 0)">
      <rect width="112" height="60" rx="4" fill="#161B22" stroke="#3FB950" stroke-opacity="0.5"/>
      <text x="8" y="14" class="mono" fill="#3FB950" font-size="9">07. PUSH</text>
      <circle cx="102" cy="11" r="2.5" fill="#3FB950" class="dot-7"/>
      <text x="8" y="32" class="inter" fill="#F0F6FC" font-size="11" font-weight="600">Origin Main</text>
      <text x="8" y="47" class="mono" fill="#3FB950" font-size="9">Synced</text>
    </g>
  </g>
</svg>

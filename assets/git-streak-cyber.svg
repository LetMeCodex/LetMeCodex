<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Radial Aura -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Flame Gradient -->
    <linearGradient id="outerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- Mid Flame Gradient -->
    <linearGradient id="midGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="65%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Incandescent Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Hairline Milestone Progress Gradient -->
    <linearGradient id="milestoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <style>
      @keyframes auraBreath {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.09); opacity: 1; }
      }
      @keyframes flameOuter {
        0%, 100% { transform: scaleY(1) skewX(0deg); }
        25% { transform: scaleY(1.03) skewX(1.4deg); }
        50% { transform: scaleY(0.97) skewX(-1.2deg); }
        75% { transform: scaleY(1.02) skewX(0.8deg); }
      }
      @keyframes flameMid {
        0%, 100% { transform: scaleY(1) skewX(0deg); }
        30% { transform: scaleY(0.96) skewX(-1.6deg); }
        70% { transform: scaleY(1.04) skewX(1.6deg); }
      }
      @keyframes flameCore {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes flameFlick {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(-3deg) scale(1.05); }
      }
      @keyframes emberFloat {
        0% { transform: translate(0, 0); opacity: 0.85; }
        50% { transform: translate(-6px, -36px); opacity: 0.6; }
        100% { transform: translate(5px, -78px); opacity: 0; }
      }
      @keyframes orbitSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes statusPulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); }
      }

      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .inter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

      .flame-aura { transform-origin: 120px 135px; animation: auraBreath 3s infinite ease-in-out; }
      .flame-outer { transform-origin: 120px 175px; animation: flameOuter 2.4s infinite ease-in-out; }
      .flame-mid { transform-origin: 120px 175px; animation: flameMid 1.8s infinite ease-in-out; }
      .flame-core { transform-origin: 120px 165px; animation: flameCore 1.4s infinite ease-in-out; }
      .flame-lick-left { transform-origin: 106px 130px; animation: flameFlick 2s infinite ease-in-out; }
      .ember { animation: emberFloat 2.2s infinite ease-out; }
      .energy-orbit { transform-origin: 120px 135px; animation: orbitSpin 14s infinite linear; }
      .status-pulse { transform-origin: 32px 24px; animation: statusPulse 2.5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Clean Background (Minimalist 1px Border, No Harsh Top Bar) -->
  <rect width="920" height="240" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- TOP HEADER BAR                                               -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(0, 0)">
    <!-- Status Dot & Title -->
    <circle cx="32" cy="24" r="3.5" fill="#38BDF8" class="status-pulse"/>
    <text x="44" y="28" class="mono" fill="#7D8590" font-size="11" font-weight="600" letter-spacing="1.5">GITSTREAK</text>
    <text x="126" y="28" class="mono" fill="#484F58" font-size="11">/ CONTRIBUTION FLAME</text>

    <!-- Top Right 7 Theme Pills (Matching Matrix Header Style) -->
    <g transform="translate(554, 13)">
      <rect x="0" y="0" width="338" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <rect x="2" y="2" width="44" height="22" rx="4" fill="transparent" stroke="transparent" stroke-width="1"/>
      <text x="24" y="16" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="500">GitHub</text>
      <rect x="50" y="2" width="44" height="22" rx="4" fill="transparent" stroke="transparent" stroke-width="1"/>
      <text x="72" y="16" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="500">Inferno</text>
      <rect x="98" y="2" width="44" height="22" rx="4" fill="transparent" stroke="transparent" stroke-width="1"/>
      <text x="120" y="16" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="500">Arcane</text>
      <rect x="146" y="2" width="44" height="22" rx="4" fill="#21262D" stroke="#38BDF8" stroke-width="1"/>
      <text x="168" y="16" text-anchor="middle" class="mono" fill="#38BDF8" font-size="10" font-weight="700">Cyber</text>
      <rect x="194" y="2" width="44" height="22" rx="4" fill="transparent" stroke="transparent" stroke-width="1"/>
      <text x="216" y="16" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="500">Zen</text>
      <rect x="242" y="2" width="44" height="22" rx="4" fill="transparent" stroke="transparent" stroke-width="1"/>
      <text x="264" y="16" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="500">Gold</text>
      <rect x="290" y="2" width="44" height="22" rx="4" fill="transparent" stroke="transparent" stroke-width="1"/>
      <text x="312" y="16" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="500">Void</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- LEFT: THE LIVING FLAME HERO                                    -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(0, 0)">
    <!-- Micro Embers -->
    <g>
      <circle cx="128" cy="172" r="2.5" fill="#E0F2FE" class="ember" style="animation-duration: 1.6s; animation-delay: 0.00s;" />
      <circle cx="110" cy="162" r="1.2" fill="#38BDF8" class="ember" style="animation-duration: 1.9s; animation-delay: 0.22s;" />
      <circle cx="122" cy="152" r="1.8" fill="#67E8F9" class="ember" style="animation-duration: 2.2s; animation-delay: 0.44s;" />
      <circle cx="134" cy="142" r="1.2" fill="#E0F2FE" class="ember" style="animation-duration: 2.5s; animation-delay: 0.66s;" />
      <circle cx="92" cy="172" r="2.5" fill="#67E8F9" class="ember" style="animation-duration: 2.8s; animation-delay: 0.88s;" />
      <circle cx="148" cy="162" r="1.2" fill="#38BDF8" class="ember" style="animation-duration: 1.6s; animation-delay: 1.10s;" />
      <circle cx="118" cy="152" r="1.8" fill="#E0F2FE" class="ember" style="animation-duration: 1.9s; animation-delay: 1.32s;" />
      <circle cx="114" cy="142" r="1.2" fill="#38BDF8" class="ember" style="animation-duration: 2.2s; animation-delay: 0.00s;" />
      <circle cx="137" cy="172" r="2.5" fill="#67E8F9" class="ember" style="animation-duration: 2.5s; animation-delay: 0.22s;" />
      <circle cx="99" cy="162" r="1.2" fill="#E0F2FE" class="ember" style="animation-duration: 2.8s; animation-delay: 0.44s;" />
      <circle cx="132" cy="152" r="1.8" fill="#67E8F9" class="ember" style="animation-duration: 1.6s; animation-delay: 0.66s;" />
      <circle cx="130" cy="142" r="1.2" fill="#38BDF8" class="ember" style="animation-duration: 1.9s; animation-delay: 0.88s;" />
      <circle cx="113" cy="172" r="2.5" fill="#E0F2FE" class="ember" style="animation-duration: 2.2s; animation-delay: 1.10s;" />
      <circle cx="133" cy="162" r="1.2" fill="#38BDF8" class="ember" style="animation-duration: 2.5s; animation-delay: 1.32s;" />
      <circle cx="110" cy="152" r="1.8" fill="#67E8F9" class="ember" style="animation-duration: 2.8s; animation-delay: 0.00s;" />
      <circle cx="117" cy="142" r="1.2" fill="#E0F2FE" class="ember" style="animation-duration: 1.6s; animation-delay: 0.22s;" />
    </g>
    <!-- Living Flame Silhouette -->
    
    <!-- Flame Soft Diffuse Aura Glow -->
    <circle cx="120" cy="135" r="85" fill="url(#auraGlow)" class="flame-aura"/>

    

    

    <!-- Main Flame Anatomy with Organic Asymmetric Licking Curves -->
    <g transform="translate(120, 140) scale(1.15) translate(-120, -140)">
      <!-- Outer Flame Lick -->
      <path d="M 120 52 
               C 140 80, 166 106, 160 150 
               C 154 182, 94 182, 86 148 
               C 80 118, 102 88, 118 52 Z"
            fill="url(#outerGrad)"
            class="flame-outer" />

      <!-- Secondary Mid Lick (Asymmetric Sway) -->
      <path d="M 124 66 
               C 148 94, 158 124, 150 154 
               C 142 176, 104 176, 96 152 
               C 90 126, 106 98, 124 66 Z"
            fill="url(#midGrad)"
            class="flame-mid" />

      <!-- Side Flick Tongue -->
      <path d="M 98 134 
               C 84 110, 92 86, 106 78 
               C 102 100, 110 122, 116 138 Z" 
            fill="#38BDF8" 
            opacity="0.85" 
            class="flame-lick-left" />

      <!-- Incandescent Luminous Inner Core -->
      <path d="M 120 96 
               C 132 116, 142 136, 136 158 
               C 130 174, 110 174, 104 158 
               C 98 136, 108 116, 120 96 Z"
            fill="url(#coreGrad)"
            class="flame-core" />

      <!-- White Hot Ignition Point -->
      <ellipse cx="120" cy="150" rx="5" ry="12" fill="#FFFFFF" opacity="0.95" class="core-hotspot" />
    </g>

    <!-- Subtle Ground Ambient Shimmer (No Heavy Pedestal) -->
    <ellipse cx="120" cy="184" rx="38" ry="5" fill="#161B22" opacity="0.6"/>
    <ellipse cx="120" cy="184" rx="22" ry="2.5" fill="#0284C7" opacity="0.35"/>
  
  </g>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- RIGHT: EDITORIAL MINIMALIST STREAK & TELEMETRY ARENA            -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(0, 0)">
    <!-- Hero Streak Counter & Status Row -->
    <g transform="translate(230, 86)">
      <!-- Giant Odometer Number -->
      <text x="0" y="0" class="inter" fill="#F0F6FC" font-size="52" font-weight="800" letter-spacing="-1.5">10</text>
      
      <!-- Units & Status Tag -->
      <g transform="translate(76, 0)">
        <text x="0" y="-20" class="inter" fill="#38BDF8" font-size="15" font-weight="700" letter-spacing="0.5">DAYS STREAK</text>
        <text x="0" y="-3" class="mono" fill="#8B949E" font-size="11" font-weight="600" letter-spacing="0.8">HOT TIER</text>
      </g>

      <!-- Fuel Status Callout -->
      <g transform="translate(410, -20)">
        
        <text x="0" y="0" class="mono" fill="#3FB950" font-size="11" font-weight="600">⚡ 9 CONTRIBUTIONS TODAY</text>
        <text x="0" y="16" class="mono" fill="#7D8590" font-size="10">Active flame burning for LetMeCodex</text>
        
      </g>
    </g>

    <!-- Milestone Tracker & Hairline Progress Bar -->
    <g transform="translate(230, 118)">
      <text x="0" y="0" class="mono" fill="#8B949E" font-size="11">Next Milestone: <tspan fill="#F0F6FC" font-weight="600">14 Days</tspan> <tspan fill="#7D8590">(4 days to go)</tspan></text>
      <text x="662" y="0" text-anchor="end" class="mono" fill="#38BDF8" font-size="11" font-weight="600">43%</text>

      <!-- Hairline Track -->
      <rect x="0" y="8" width="662" height="3" rx="1.5" fill="#21262D"/>
      <rect x="0" y="8" width="285" height="3" rx="1.5" fill="url(#milestoneGrad)"/>
    </g>

    <!-- Minimalist Horizontal Telemetry Stats -->
    <g transform="translate(230, 168)" class="inter" font-size="12">
      <text x="0" y="0" fill="#7D8590">Longest Streak: <tspan fill="#F0F6FC" font-weight="600">10 Days</tspan></text>
      <text x="180" y="0" fill="#30363D">•</text>
      <text x="198" y="0" fill="#7D8590">Total Contributions: <tspan fill="#F0F6FC" font-weight="600">1,351</tspan></text>
      <text x="430" y="0" fill="#30363D">•</text>
      <text x="448" y="0" fill="#7D8590">Heat Intensity: <tspan fill="#38BDF8" class="mono" font-weight="600">63%</tspan></text>
    </g>

    <!-- 20-Day Fuel Energy Strip -->
    <g transform="translate(230, 208)">
      <text x="0" y="-1" class="mono" fill="#484F58" font-size="10" letter-spacing="1">20-DAY FUEL CONNECTOR</text>
      <g transform="translate(-230, -208)">
        <rect x="440" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="462.5" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="485" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="507.5" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="530" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="552.5" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="575" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="597.5" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="620" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="642.5" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="665" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="687.5" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="710" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="732.5" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="755" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="777.5" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="800" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="822.5" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="845" y="202" width="16" height="8" rx="2" fill="#161B22" />
      <rect x="867.5" y="202" width="16" height="8" rx="2" fill="#161B22" />
      </g>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 76" width="100%" height="100%">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FA7A18" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#631C03" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="outerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#631C03" />
      <stop offset="45%" stop-color="#BD561D" />
      <stop offset="100%" stop-color="#FA7A18" />
    </linearGradient>
    <linearGradient id="midGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#BD561D" />
      <stop offset="55%" stop-color="#FA7A18" />
      <stop offset="100%" stop-color="#FDDF68" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FA7A18" />
      <stop offset="60%" stop-color="#FDDF68" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <style>
      @keyframes auraBreath {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes flameOuterSway {
        0%, 100% { transform: scaleY(1) skewX(0deg); }
        25% { transform: scaleY(1.04) skewX(1.8deg); }
        50% { transform: scaleY(0.97) skewX(-1.5deg); }
        75% { transform: scaleY(1.02) skewX(1.2deg); }
      }
      @keyframes flameMidSway {
        0%, 100% { transform: scaleY(1) skewX(0deg); }
        30% { transform: scaleY(0.96) skewX(-2deg); }
        70% { transform: scaleY(1.05) skewX(2.2deg); }
      }
      @keyframes flameCorePulse {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes sparkFloat {
        0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.9; }
        50% { transform: translate(-8px, -18px) rotate(-8deg) scale(0.9); opacity: 0.5; }
      }
      @keyframes emberAscent {
        0% { transform: translate(0, 0); opacity: 0.9; }
        50% { transform: translate(-3px, -18px); opacity: 0.6; }
        100% { transform: translate(3px, -36px); opacity: 0; }
      }

      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .inter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

      .flame-aura-anim { transform-origin: -11px 0px; animation: auraBreath 3s infinite ease-in-out; }
      .flame-outer-anim { transform-origin: -11px 192px; animation: flameOuterSway 2.4s infinite ease-in-out; }
      .flame-mid-anim { transform-origin: -11px 192px; animation: flameMidSway 1.8s infinite ease-in-out; }
      .flame-core-anim { transform-origin: -11px 160px; animation: flameCorePulse 1.4s infinite ease-in-out; }
      .spark-float-anim { transform-origin: -81px -212px; animation: sparkFloat 2s infinite ease-in-out; }
      .ember { animation: emberAscent 2s infinite ease-out; }
    </style>
  </defs>

  <!-- Clean Minimalist Frame (Matches Matrix 1px Border and Radius) -->
  <rect width="920" height="76" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Left: The Living Flame Animation (Scaled to fit seamlessly in 76px) -->
  <g transform="translate(48, 38)">
    <circle cx="-14" cy="16" r="1.4" fill="#FA7A18" class="ember" style="animation-duration: 1.9s; animation-delay: 0s;" />
      <circle cx="-22" cy="12" r="1.1" fill="#FA7A18" class="ember" style="animation-duration: 2.3s; animation-delay: 0.5s;" />
      <circle cx="-5" cy="18" r="1.3" fill="#FA7A18" class="ember" style="animation-duration: 2.1s; animation-delay: 1.1s;" />
      <circle cx="8" cy="15" r="1.5" fill="#FA7A18" class="ember" style="animation-duration: 1.8s; animation-delay: 0.3s;" />
      <circle cx="18" cy="11" r="1.2" fill="#FA7A18" class="ember" style="animation-duration: 2.4s; animation-delay: 0.8s;" />
    
    <g class="flame-group" transform="scale(0.135)">
      <!-- Aura Glow -->
      <circle cx="-11" cy="0" r="230" fill="url(#auraGlow)" class="flame-aura-anim" />

      

      

      <!-- Shadow & Silhouette Outline -->
      <g class="flame-outer-anim" opacity="0.5">
        <path fill="#631C03" d="M-11.648,-198.368 C-42.315,-49.21 -191.842,-7.631 -11,192 C136.105,-1.263 65.263,-120 -11.648,-198.368z"/>
        <path stroke="#FA7A18" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35" d="M-11.648,-198.368 C-42.315,-49.21 -191.842,-7.631 -11,192 C136.105,-1.263 65.263,-120 -11.648,-198.368z"/>
      </g>

      <!-- Main Outer Flame (Exact Lottie Tongues) -->
      <g class="flame-outer-anim">
        <path fill="url(#outerGrad)" d="M-11.648,-198.368 C-42.315,-49.21 -191.842,-7.631 -11,192 C136.105,-1.263 65.263,-120 -11.648,-198.368z"/>
        <path fill="url(#outerGrad)" d="M-36.898,-145.17 C-101.993,-71.701 -126.604,15.347 -11,192 C115.073,-14.97 -61.444,-36.548 -36.898,-145.17z"/>
        <path fill="url(#outerGrad)" d="M-36.898,-145.17 C-29.625,-141.125 -8.262,-154.805 -11.627,-198.246 C2.443,-53.713 -69.323,-90.814 -36.898,-145.17z"/>
        <path fill="url(#outerGrad)" d="M-107.023,-59.32 C-166.38,13.28 -113.38,144.70 -11,192 C81.5,-23.5 -116.16,47.34 -107.023,-59.32z"/>
        <path fill="url(#outerGrad)" d="M-135.05,84.36 C-148.51,123.68 -85.94,192 -11,192 C17.15,68.55 -110.18,126.14 -135.05,84.36z"/>
        <path fill="url(#outerGrad)" d="M-88.60,158.17 C-68.90,166.72 -65,192 -11,192 C-21.72,149.02 -65.19,155.08 -88.60,158.17z"/>
        <path fill="url(#outerGrad)" d="M108.98,-59.68 C75.36,10.05 -46.55,2.52 -11,192 C122.73,140.84 144.78,40.84 108.98,-59.68z"/>
        <path fill="url(#outerGrad)" d="M121.36,118.23 C75,114.89 -10.79,121.61 -11,192 C87.47,192 107.68,134.94 121.36,118.23z"/>
        <path fill="url(#outerGrad)" d="M30.97,176.34 C14.27,167.16 -10.95,175.79 -11.04,191.24 C15.45,191.24 24.57,172.66 30.97,176.34z"/>
      </g>

      <!-- Middle Flame Layer (Exact Lottie Second Tongues) -->
      <g class="flame-mid-anim">
        <path fill="url(#midGrad)" d="M-11,192 C95.52,-18.31 32.10,-80.47 -8.70,-156.68 C-20.73,-86.36 -137.36,-109.73 -11,192z"/>
        <path fill="url(#midGrad)" d="M-11,192 C91.10,134.84 87.78,21.68 89.94,-18.17 C66.10,16.26 -35.5,-26.39 -11,192z"/>
        <path fill="url(#midGrad)" d="M-11,192 C72.68,161 101.84,113.57 103.95,90.03 C80.63,96 0.10,82.63 -11,192z"/>
        <path fill="url(#midGrad)" d="M-11,192 C59.28,192 51.13,153.18 76.98,142.36 C51.55,130.44 -9.80,147.38 -11,192z"/>
        <path fill="url(#midGrad)" d="M-8.17,-154.36 C-34.65,101.78 66.13,95 89.94,-18.17 C82.97,-8.24 71.32,-5.95 59.66,-8.89 C26.23,-14.98 49.89,-80.47 -8.17,-154.36z"/>
        <path fill="url(#midGrad)" d="M-11,192 C7.32,-10.82 -77.20,70.96 -109.08,-4.89 C-134.87,51.84 -72.07,131.74 -11,192z"/>
        <path fill="url(#midGrad)" d="M-11,192 C-11,76.50 -65.35,143.31 -101.39,111.51 C-97.47,164.05 -49.62,192 -11,192z"/>
        <path fill="url(#midGrad)" d="M-56.93,-80.83 C-66.55,-59.58 -58.92,-19.35 -69.43,0.08 C-76.84,13.80 -96.81,13.31 -108.98,-4.99 C-126.03,76.33 2.02,102.01 -56.93,-80.83z"/>
      </g>

      <!-- Third Highlight Layer -->
      <g opacity="0.32" class="flame-mid-anim">
        <path fill="#FDDF68" d="M-0.026,-98.88 C0.157,-47.05 -108,-67.78 -12,192.42 C44.68,101.84 31.31,-9.47 -0.026,-98.88z M57.63,23.73 C49.08,31.12 24.81,33.76 21.16,7.69 C17.16,-21.13 -31.30,63.64 -12,192.42 C28.84,120.26 84.57,116.94 57.63,23.73z M-80.12,54.82 C-84.81,113.66 -41.15,143.19 -12,192.42 C-9.15,136.64 -42.23,10.05 -47.53,30.36 C-49.09,64.02 -64.24,57.06 -80.12,54.82z"/>
      </g>

      <!-- Core Hearth Layer (Exact Lottie Core Tongues) -->
      <g class="flame-core-anim">
        <path fill="url(#coreGrad)" d="M-5.87,-22.27 C-12.09,25.84 -77.88,36.63 -12,192.42 C74.23,64.59 -12.02,43.79 -5.87,-22.27z"/>
        <path fill="url(#coreGrad)" d="M42.90,56.23 C28.57,82.21 -28.19,74.48 -12,192.42 C27.07,145.77 36.23,140.23 42.90,56.23z"/>
        <path fill="url(#coreGrad)" d="M70.01,103.60 C43.15,112.26 -16.5,82.5 -12,192.42 C32.23,165.57 57.68,133.5 70.01,103.60z"/>
        <path fill="url(#coreGrad)" d="M-61.02,87.46 C-65.47,104.16 -62.65,139.36 -12,192.42 C15.22,90.81 -43.62,102.51 -61.02,87.46z"/>
        <path fill="url(#coreGrad)" d="M-60.80,142.56 C-53.52,154.91 -54.20,178.63 -12,192.42 C-3.07,138.74 -41.61,137.68 -60.80,142.56z"/>
      </g>

      <!-- Incandescent Center Core Hotspot -->
      <ellipse cx="-11" cy="142" rx="14" ry="24" fill="#FFFFFF" opacity="0.95" class="flame-core-anim" />

      <!-- Top-Left Detached Lick / Spark (Layer 75 from Lottie) -->
      <g class="spark-float-anim">
        <path fill="#FA7A18" d="M-81.61,-212.15 C-78.53,-191.03 -118.03,-193.80 -97.59,-151.04 C-97.08,-151.74 -96.45,-152.17 -95.86,-152.01 C-68.61,-174.70 -66.37,-195.21 -81.61,-212.15z"/>
        <path stroke="#FDDF68" stroke-width="6" fill="none" opacity="0.75" d="M-81.61,-212.15 C-78.53,-191.03 -118.03,-193.80 -97.59,-151.04 C-97.08,-151.74 -96.45,-152.17 -95.86,-152.01 C-68.61,-174.70 -66.37,-195.21 -81.61,-212.15z"/>
      </g>
    </g>
  
  </g>

  <!-- Left Center: Streak Count & Tier Tag -->
  <g transform="translate(88, 0)">
    <text x="0" y="49" class="inter" fill="#F0F6FC" font-size="34" font-weight="800" letter-spacing="-1">10</text>
    <text x="50" y="36" class="inter" fill="#FA7A18" font-size="13" font-weight="700" letter-spacing="0.5">DAYS STREAK</text>
    <text x="50" y="52" class="mono" fill="#8B949E" font-size="11" font-weight="500">HOT TIER</text>
  </g>

  <!-- Subtle Minimal Vertical Divider -->
  <line x1="265" y1="20" x2="265" y2="56" stroke="#21262D" stroke-width="1"/>

  <!-- Right Center: Longest Streak Metric -->
  <g transform="translate(295, 0)">
    <text x="0" y="36" class="mono" fill="#7D8590" font-size="10" letter-spacing="1">LONGEST STREAK</text>
    <text x="0" y="54" class="inter" fill="#F0F6FC" font-size="15" font-weight="700">10 Days</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <style>
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes beaconBlink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .inter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .radar-arm { transform-origin: 50px 80px; animation: radarSweep 3.5s infinite linear; }
      .beacon { animation: beaconBlink 1.4s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Card Base -->
  <rect width="850" height="160" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Subheader -->
  <rect x="0" y="0" width="850" height="34" rx="8" fill="#161B22"/>
  <rect x="0" y="26" width="850" height="8" fill="#161B22"/>
  <line x1="0" y1="34" x2="850" y2="34" stroke="#30363D" stroke-width="1"/>

  <g transform="translate(16, 21)">
    <text x="0" y="0" class="mono" fill="#7D8590" font-size="11">02. GITHUB ACTIVITY</text>
    <text x="120" y="0" class="mono" fill="#30363D">•</text>
    <text x="132" y="0" class="mono" fill="#10B981" font-size="11" font-weight="700">DIGITAL PHOSPHOR STREAM</text>
  </g>

  <!-- 7-Day Quick Pills on Top Right -->
  <g transform="translate(480, 8)">
    <rect x="0" y="0" width="46" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="23" y="12" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="400">Sun</text>
    <rect x="50" y="0" width="46" height="18" rx="4" fill="#21262D" stroke="#10B981" stroke-width="1"/>
      <text x="73" y="12" text-anchor="middle" class="mono" fill="#10B981" font-size="10" font-weight="700">Mon</text>
    <rect x="100" y="0" width="46" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="123" y="12" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="400">Tue</text>
    <rect x="150" y="0" width="46" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="173" y="12" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="400">Wed</text>
    <rect x="200" y="0" width="46" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="223" y="12" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="400">Thu</text>
    <rect x="250" y="0" width="46" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="273" y="12" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="400">Fri</text>
    <rect x="300" y="0" width="46" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="323" y="12" text-anchor="middle" class="mono" fill="#7D8590" font-size="10" font-weight="400">Sat</text>
  </g>

  <!-- Left Radar & Planetary Sensor -->
  <g transform="translate(20, 10)">
    <circle cx="50" cy="80" r="38" fill="none" stroke="#10B981" stroke-opacity="0.2" stroke-dasharray="3 3"/>
    <circle cx="50" cy="80" r="24" fill="none" stroke="#10B981" stroke-opacity="0.3"/>
    <circle cx="50" cy="80" r="10" fill="none" stroke="#10B981" stroke-opacity="0.45"/>
    <circle cx="50" cy="80" r="2.5" fill="#10B981"/>
    <line x1="50" y1="80" x2="88" y2="80" stroke="#10B981" stroke-width="1.75" class="radar-arm"/>
  </g>

  <!-- Center Telemetry Info -->
  <g transform="translate(130, 58)">
    <g transform="translate(0, 0)">
      <rect width="180" height="20" rx="4" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="10" cy="10" r="3" fill="#10B981" class="beacon"/>
      <text x="20" y="14" class="mono" fill="#10B981" font-size="10" font-weight="700">TODAY's EASTER EGG</text>
      <text x="200" y="14" class="mono" fill="#7D8590" font-size="10">IST DATE: 2026-09-07</text>
    </g>

    <text x="0" y="44" class="mono" fill="#F0F6FC" font-size="20" font-weight="800">
      ⚡ Cyberpunk Phosphor
    </text>

    <text x="0" y="64" class="inter" fill="#7D8590" font-size="12" font-style="italic">
      "Continuous stream of green phosphor commits. Zero dropped frames."
    </text>

    <!-- Palette Swatches for Today -->
    <g transform="translate(0, 76)">
      <text x="0" y="10" class="mono" fill="#7D8590" font-size="10">Active Intensity Palette:</text>
      
        <rect x="145" y="1" width="12" height="12" rx="2" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
      
        <rect x="161" y="1" width="12" height="12" rx="2" fill="#064E3B" stroke="#21262D" stroke-width="1"/>
      
        <rect x="177" y="1" width="12" height="12" rx="2" fill="#059669" stroke="#21262D" stroke-width="1"/>
      
        <rect x="193" y="1" width="12" height="12" rx="2" fill="#10B981" stroke="#21262D" stroke-width="1"/>
      
        <rect x="209" y="1" width="12" height="12" rx="2" fill="#34D399" stroke="#21262D" stroke-width="1"/>
      
      <text x="238" y="10" class="mono" fill="#7D8590" font-size="10">• Rough.js Circuit Traces & Terminal Bracket Geometries</text>
    </g>
  </g>

  <!-- Right Side Live Flag -->
  <g transform="translate(710, 80)">
    <rect x="0" y="0" width="118" height="34" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="12" y="14" class="mono" fill="#3FB950" font-size="10" font-weight="700">● 7-DAY ENGINE</text>
    <text x="12" y="27" class="mono" fill="#7D8590" font-size="9">Auto-Shift: 00:00 UTC</text>
  </g>
</svg>